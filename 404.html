<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inluna · catálogo del taller</title>
  <!-- Cualquier dirección mal escrita (por ejemplo /Catalogo con mayúscula) vuelve al catálogo -->
  <script>
    (function () {
      var ruta = location.pathname.toLowerCase();
      var destino = ruta.indexOf('/catalogo') === 0 && ruta !== location.pathname ? ruta : '/catalogo/';
      location.replace(destino + location.search + location.hash);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=/catalogo/">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4eee1; color: #3a2a1f; font: 17px system-ui, sans-serif; }
    a { color: #16803a; }
  </style>
</head>
<body>
  <p><a href="/catalogo/">Entrar al taller de Inluna ✦</a></p>
</body>
</html>
